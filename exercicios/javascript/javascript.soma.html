<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>

    <h1>um pouco de JavaScript</h1>

    <form action="cadastro.php">


<p>
    <label for="in1">Numero 1: </label>
    <input type="number" name="n1" id="in1" required min="-100" max="100"
    oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
</p>

<p>
    <label for="in2">Numero 2: </label>
    <input type="number" name="n2" id="in2" required min="0" max="100"
    oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
</p>



<p>
    <label for="isoma">Soma: </label>
    <output id="isoma">0</output>
</p>





<p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
</p>

    </form>
    
</body>
</html>

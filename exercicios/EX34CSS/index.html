<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>criando uma tabela real e simples</title>

<style>
    table {
        border-collapse: collapse;
    }

    tr, td, th {
        
        border: 2px solid black;
        width: 200px;
        height: 20px;
        padding: 5px;
    }

.center {
    text-align: center;
    font-weight: bolder;
}

</style>


</head>
<body>
    
    <table>
<caption>
    preferencias

    <thead>
        
                <tr>
                    <th class="center" scope="col">Grupo</th>
                    <th class="center" scope="col">nomes</th>
                    <th colspan="3" class="center" scope="colgroup">filmes</th>
        
                </tr>
        
    </thead>

<tbody>
    
                <tr>
                    <th rowspan="3" class="center" scope="rowgroup">mulheres</th>
                    <td>ana maria santos</td>
                    <td>alien</td>
                    <td>rambo</td>
                    <td>vingadores</td>
    
                </tr>
    
                <tr>
    
                <td>beatriz souza</td>
                <td>hulk</td>
                <td>inception</td>
                <td>batman</td>
    
                </tr>
    
         <tr>
    
                <td>claudia melo</td>
                <td>oblivion</td>
                <td>matrix</td>
                <td>big hero</td>
    
    
                </tr>
    
                 <tr>
    
                <th rowspan="3" class="center" scope="rowgroup">homens</th>
                <td>bruno</td>
                <td>intocaveis</td>
                <td>amnesia</td>
                <td>gladiador</td>
    
    
                </tr>
    
                 <tr>
    
                <td>daniel</td>
                <td>wali</td>
                <td>oldboy</td>
                <td>dangal</td>
    
    
                </tr>
    
                 <tr>
    
                <td>fabiano</td>
                <td>star wars</td>
                <td>taxi driver</td>
                <td>toy story</td>
    
                </tr>
</tbody>


                <tfoot>

                    <tr>
                        <th colspan="4">total</th>
                        <td scope="row">1000</td>
                    </tr>


                </tfoot>

</caption>

    </table>


</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>

    <link rel="stylesheet" href="meuestilo.css">

</head>
<body>

    <h1>construçaõ de grande tabela</h1>

    <table>

        <thead>
                <tr class="cabeca">
                    <th>Posição</th>
                    <th>Unidade Federativa</th>
                    <th>População</th>
                </tr>
        </thead>

        <tbody>
                <tr>
                    <td>1</td>
                    <td>São paulo</td>
                    <td class="num">45.000.000</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Minas gerais</td>
                    <td class="num">30.000.000</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Rio de janeiro  </td>
                    <td class="num">20.000.000</td>
                </tr>

                <tr>
                    <td>4</td>
                    <td>Bahia</td>
                    <td class="num">15.000.000</td>
                </tr>

                <tr>
                    <td>5</td>
                    <td>Roraima</td>
                    <td class="num">12.000.000</td>
                </tr>

                <tr>
                    <td>6</td>
                    <td>Acre</td>
                    <td class="num">10.000.000</td>
                </tr>
        </tbody>

        <tfoot>
                <tr>
                    <td>Total da população</td>
                    <td></td>
                    <td class="num">210.000.000</td>
                </tr>
                
        </tfoot>

    </table>



</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>

    <style>
        table {
            height: 10px;
            width: 400px;
            margin: auto;
            border-collapse: collapse;
        }

        td {
            height: 20px;
            border: 1px solid black;
            padding: 10px;
           
        }

        td#linha {
            background-color: blue;
        }

        td#palavra {
            color: red;
        }

        tr#base {
            background-color: gray;
        }

    </style>

    

</head>
<body>
    <h1>primeira tabela</h1>

    <table>
        <tr>
            primeira linha 
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>

        <tr>
            <td id="linha">A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>

        <tr>
            <td id="palavra">A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>

        <tr id="base">
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>


    </table>

</body>
</html>

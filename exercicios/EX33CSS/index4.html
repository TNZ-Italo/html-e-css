<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mesclagem</title>

<style>
    table {
        border-collapse: collapse;
        width: 400px;

    }

    td {
        padding: 10px;
        border: 1px solid black;
        text-align: center;
    }
</style>







</head>
<body>

    <h1>mesclagem de tabela</h1>

<table>
    <tr>
        <td>A</td>
        <td colspan="2">B</td>

    </tr>

    <tr>
        <td rowspan="2">D</td>
        <td rowspan="2">E</td>
        <td rowspan="3">F</td>
    </tr>

    <tr>
      
        
       
    </tr>

    <tr>
       
        <td colspan="2">K</td>
       
    </tr>

</table>


    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela comum</title>

<style>

    tbody > tr:nth-child(2n) {
        background-color: aqua;

    }

    div#container {
        width: 70vw;
    }

    table {
        border-collapse: collapse;
        text-align: center;
        
    }

.cinza {
    background-color: gray;
    color: white;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    
}

    tr, td, th {
        border: 2px solid black;
        height: 30px;
        width: 150px;
    }

td.a1 {
    background-color: white;
    color: black;
}

img {
    height: 400px;
    width: 400px;
    border-radius: 0px 100px 0px 100px;
}



</style>

</head>
<body>
    
    <div id="container">
        <table>
        
        <caption>  notas e avaliações
        
        
                <tr class="cinza">
                    <th rowspan="2" >area</th>
                    <th rowspan="2">disciplina</th>
                    <th colspan="2" >notas</th>
                    <th rowspan="2" >media</th>
                </tr>
        
               <tr class="cinza">
        
                <td class="a1">nota 1</td>
                <td class="a1">nota 2</td>
        
               </tr>
        
        
                <tr>
                    <td rowspan="4">exatas</td>
                    <td>matematica</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                 </tr>
        
        
                 <tr>
                    <td>fisica</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
        
                 </tr>
        
        
                 <tr>
                    <td>quimica</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
        
                 </tr>
        
        
                 <tr>
                    <td>biologia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
        
                 </tr>
        
        
                <tr>
                    <th colspan="4" class="cinza">media de exatas</th>
                    <th class="cinza">0</th>
        
                </tr>
        
        
                  <tr>
        
                            <td class="a1" rowspan="2">humanas</td>
                            <td>historia</td>
                            <td>0.0</td>
                            <td>0.0</td>
                            <td>0.0</td>
                 </tr>
        
                <tr>
                            <td>geografia</td>
                            <td>0.0</td>
                            <td>0.0</td>
                            <td>0.0</td>
        
                </tr>
        
        
                 <tr>
                            <th colspan="4" class="cinza">media de humanas</th>
                            <td class="cinza">0</td>
        
                </tr>
        
        </caption>
        </table>
    </div>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select-datalist-textarea</title>
</head>
<body>

    <h1>Select - Datalist - Textarea</h1>
    
    <form action="cadastro.php">

        <p>
            <label for="iestado">Estado: </label>
            <select name="estado" id="iestado">
                
                <option value="">Pesquisa aqui</option>

            <optgroup label="Região sudeste">
                <option value="SP"> São Paulo</option>
                <option value="MG"> Minas Gerais</option>
                <option value="Rj"> Rio de Janeiro</option>
            </optgroup>


            <optgroup label="Região nordeste">
                <option value="PE"> Pernanbuco</option>
                <option value="BH"> Bahia</option>
                <option value="PB"> Paraiba</option>
            </optgroup>

            </select>

        </p>

       <p>
          <label for="iprofissao"> Escolha sua profissão: </label>
          <input type="text" name="profissao" id="iprofissao" list="lstprofissao">

          <datalist id="lstprofissao">

            <option>Administrador</option>
            <option>Contador</option>
            <option value="INF">Influencer</option>
            <option value="DEV">Desenvolvedor</option>
            <option value="ELE">Eletricista</option>

          </datalist>

       </p>

       <p>

        <label for="imsg">Mensagem: </label> <br>
        <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>

       </p>



        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>

    </form>




</body>
</html>

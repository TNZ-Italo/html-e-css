<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>

<body>
    
    <h1>Criando formulario...</h1>

    <form action="cadastro.php" method="post">

        <p> <label for="icidade">CIDADE:</label> <input type="text" name="cidade" id="icidade" placeholder="sua cidade"></p>

        <p> <label for="ibairro">BAIRRO:</label> <input type="text" name="bairro" id="ibairro" placeholder="seu bairro"></p>

        <p><label for="inota">NOTA:</label> <input type="number" name="nota" id="inota" min="0" max="100" step="0.1"  maxlength="3" placeholder="sua nota"></p>

        <p><label for="imes">Periodo Letivo</label> <input type="month" name="mes" id="imes" value="2026-01"></p>

        <p><label for="idia"> Dia da Prova</label> <input type="date" name="dia" id="idia" value="2026-10-22"></p>

        <P><label for="ihora">HORA: </label> <input type="time" name="HORA" id="ihora" value="00:00"></P>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>

     
</body>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color, range e file html</title>
</head>
<body>

    <h1>Color, Range e File html</h1>

    <form action="cadastro.php">

        <P>
             <label for="icor">Escolha uma cor: </label> <input type="color" name="cor" id="icor" value="#d02525">
        </P>

        <p>
            <label for="inivel">Sua satisfação: </label> 
            <input type="range" name="nivel" id="inivel" min="0" max="10" value="3">
        </p>

        <p>
            <label for="ifoto"> enviar sua foto: </label>
            <input type="file" name="foto" id="ifoto">
        </p>

        <input type="submit" value="Enviar">

        <input type="reset" value="Limpar">



    </form>
    
</body>
</html>

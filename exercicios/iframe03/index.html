<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

<style>

    * {
        margin: 0px;
        padding: 0px;
    }

div {
    height: 350px;
    width: 100vw;
    background: linear-gradient(to bottom, rgb(247, 17, 205) 9%, rgb(247, 40, 205), rgb(247, 70, 205)  20%, transparent);
}

div:hover {
}

form > p > input {
    background-color: rgb(245, 245, 245);
    
}

form {
    color: rgb(241, 241, 241);
}


form > p.a2 > input {
    background-color: blue;
    color: white;
}

input {
    color: rgb(50, 28, 161);
    background-color: blue;
}

</style>


</head>
<body>

<div>

    <main>

    <h1>Como cria formulario?</h1>
    
    <form>

        <p class="a1">nome: <input type="text" name="nome" id="nome"></p>
        <p>sobrenome: <input type="text" name="sobrenome" id="sobrenome"></p>
        <p class="a2"><input type="submit" value="enviar"></p>

    </form>

    <h1>criando o segundo formulario..</h1>

    <form>

        <p>cargo <input type="text" name="cargo" id="cargo"></p>
        <p>funcao <input type="text" name="funcao" id="funcao"></p>

        <p class="a2"><input type="submit" value="mandar"></p>

    </form>

    </main>
    
</div>


</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckBox e Radio button</title>
</head>
<body>
    <h1>CheckBox e Radio Button</h1>

    <form action="cadastro.php" method="get"></form>

    <fieldset>

        <legend>Esportes</legend>

        <input type="checkbox" name="futebol" id="ifutebol"> <label for="ifutebol">Futebol</label>
        <input type="checkbox" name="volei" id="ivolei"> <label for="ivolei">Volei</label>
        <input type="checkbox" name="basquete" id="ibasquete"> <label for="ibasquete">Basquete</label>
        <input type="checkbox" name="natacao" id="inatacao"> <label for="inatacao">Natacao</label>
        <input type="checkbox" name="handbol" id="ihandbol"> <label for="ihandbol">Handbol</label>

    </fieldset>

    <fieldset>

        <legend>Sexo</legend>

        <p><input type="radio" name="sexo" id="imasc"> <label for="imasc">MASCULINO</label>

        <input type="radio" name="sexo" id="ifemi"> <label for="ifemi">FEMININO</label></P>

    </fieldset>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>

</body>
</html>

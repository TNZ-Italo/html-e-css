<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe</title>

<style>
    div#container {
        height: 98vw;
        width: 99vw;
        background-color: aqua;
    }

    iframe {
        margin: auto;
        margin-bottom: 50px;
        height: 300px;
        width: 500px;
        display: block;
    }

    iframe#q1 {
        border: 5px solid black;
    }

    iframe#q2 {
        border: 5px solid red;
    }


</style>


</head>
<body>

    <h1>teste de iframe</h1>


<div id="container">
    
    <iframe id="q1" src="https://tnz-italo.github.io/projeto-cordel/" frameborder="1">
    
    </iframe>
    
    
    
    <iframe id="q2" src="https://tnz-italo.github.io/android/" frameborder="1">
    
    </iframe>
</div>


    
</body>
</html>
